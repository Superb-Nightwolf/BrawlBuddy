<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="ammoBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffbe0b"/>
      <stop offset="35%" stop-color="#fb5607"/>
      <stop offset="100%" stop-color="#c1121f"/>
    </linearGradient>
    <linearGradient id="ammoGleam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="ammoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 3 Official Brawl Stars Segmented Ammo Bars -->
  <g filter="url(#ammoShadow)">
    <!-- Bar 1 -->
    <rect x="7" y="11" width="9" height="26" rx="4.5" fill="url(#ammoBarGrad)" stroke="#1a1412" stroke-width="2.5"/>
    <!-- Highlight 1 -->
    <rect x="8.5" y="13" width="2.5" height="11" rx="1.2" fill="url(#ammoGleam)"/>

    <!-- Bar 2 -->
    <rect x="19.5" y="11" width="9" height="26" rx="4.5" fill="url(#ammoBarGrad)" stroke="#1a1412" stroke-width="2.5"/>
    <!-- Highlight 2 -->
    <rect x="21" y="13" width="2.5" height="11" rx="1.2" fill="url(#ammoGleam)"/>

    <!-- Bar 3 -->
    <rect x="32" y="11" width="9" height="26" rx="4.5" fill="url(#ammoBarGrad)" stroke="#1a1412" stroke-width="2.5"/>
    <!-- Highlight 3 -->
    <rect x="33.5" y="13" width="2.5" height="11" rx="1.2" fill="url(#ammoGleam)"/>
  </g>
</svg>
